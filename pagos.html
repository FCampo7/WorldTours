<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/pagos.css" />
		<link rel="stylesheet" href="./css/style-general.css" />
		<link
			href="https://fonts.cdnfonts.com/css/helvetica-neue-55"
			rel="stylesheet"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
			crossorigin="anonymous"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
		/>
		<title>WorldTours | Pago</title>
	</head>
	<body>
		<header>
			<nav class="navbar navbar-expand-lg bg-body-tertiary">
				<div class="container-fluid">
					<a class="navbar-brand" href="/">
						<img
							id="logo"
							src="./assets/imagenes/logo.png"
							alt="Logo"
						/>
					</a>
					<button
						class="navbar-toggler"
						type="button"
						data-bs-toggle="collapse"
						data-bs-target="#navbarSupportedContent"
						aria-controls="navbarSupportedContent"
						aria-expanded="false"
						aria-label="Toggle navigation"
					>
						<span class="navbar-toggler-icon"></span>
					</button>
					<div
						class="collapse navbar-collapse"
						id="navbarSupportedContent"
					>
						<ul class="navbar-nav me-auto mb-2 mb-lg-0">
							<li class="nav-item">
								<a
									class="nav-link active"
									aria-current="page"
									href="#"
									>Inicio</a
								>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="destinos.html"
									>Destinos</a
								>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="contacto.html"
									>Contacto</a
								>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="planes.html"
									>Planes</a
								>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="ofertas.html"
									>Ofertas</a
								>
							</li>
						</ul>
						<form class="d-flex" role="search">
							<input
								class="form-control me-2"
								type="search"
								placeholder="Buscar"
								aria-label="Search"
							/>
							<button
								class="btn btn-success btn-transition"
								type="submit"
							>
								Buscar
							</button>
						</form>
					</div>
				</div>
			</nav>
		</header>

		<main id="main">
			<div class="container-flex">
				<div class="tarjeta-container">
					<div class="tarjeta-front">
						<img class="tarjeta-logo" src="./assets/imagenes/card/card-logo.svg"></img>
						<div class="tarjeta-info">
							<div class="tarjeta-titular">
								<h2 id="nombre-titular">Nombre del Titular</h2>
							</div>
							<div class="tarjeta-numero">
								<p id="numero-tarjeta">1234 5678 9012 3456</p>
							</div>
							<div class="tarjeta-fechas">
								<p>Exp:</p>
								<p class="fecha-exp">12/34</p>
							</div>
						</div>
					</div>
					<div class="tarjeta-back">
						<p class="tarjeta-codigo-seguridad">123</p>
					</div>
				</div>
				<div class="pagos-formulario">
					<div class="formulario-titular">
						<label for="nombre-titular">Nombre Titular</label>
						<input
							type="text"
							id="nombre-titular-input"
							placeholder="Nombre del Titular"
							class="form-control mb-3">
					</div>
					<div class="formulario-numero">
						<label for="numero-tarjeta">N° de tarjeta</label>
						<input
							type="text"
							id="numero-tarjeta-input"
							placeholder="Número de Tarjeta"
							class="form-control mb-3">
					</div>
					<div class="formulario-fechas">
						<div class="form-group">
							<label for="fecha-exp">Exp:</label>
							<input
								type="text"
								id="fecha-exp-input"
								placeholder="01/01"
								class="form-control mb-3">
						</div>
						<div class="form-group">
							<label for="codigo-seguridad">CVV</label>
							<input
								type="text"
								id="codigo-seguridad-input"
								placeholder="123"
								class="form-control mb-3">
						</div>
					</div>
				</div>
			</div>
		</main>

		<footer class="bg-light text-center py-4 border-top">
			<h2 class="mb-3">Contáctanos</h2>
			<div class="mb-3">
				<a
					href="https://facebook.com"
					target="_blank"
					class="social-icon"
				>
					<i class="fa-brands fa-facebook"></i>
				</a>
				<a
					href="https://instagram.com"
					target="_blank"
					class="social-icon"
				>
					<i class="fa-brands fa-instagram"></i>
				</a>
				<a
					href="https://wa.me/11275898"
					target="_blank"
					class="social-icon"
				>
					<i class="fa-brands fa-whatsapp"></i>
				</a>
			</div>
		</footer>

		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
			crossorigin="anonymous"
		></script>
	</body>
</html>
